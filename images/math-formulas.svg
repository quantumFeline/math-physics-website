<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#mathGrad)" rx="15"/>

  <!-- Mathematical symbols -->
  <text x="300" y="80" font-family="serif" font-size="48" fill="white" text-anchor="middle" font-weight="bold">π r²</text>
  <text x="150" y="180" font-family="serif" font-size="36" fill="rgba(255,255,255,0.9)" text-anchor="middle">a² + b² = c²</text>
  <text x="450" y="180" font-family="serif" font-size="36" fill="rgba(255,255,255,0.9)" text-anchor="middle">∫ f(x)dx</text>
  <text x="300" y="260" font-family="serif" font-size="40" fill="white" text-anchor="middle">√(x+y)</text>
  <text x="180" y="340" font-family="serif" font-size="32" fill="rgba(255,255,255,0.85)" text-anchor="middle">sin² + cos²</text>
  <text x="420" y="340" font-family="serif" font-size="32" fill="rgba(255,255,255,0.85)" text-anchor="middle">lim(x→∞)</text>
</svg>
