<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fad0c4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gradGrad)" rx="15"/>

  <!-- Graduation cap -->
  <polygon points="300,120 200,160 400,160" fill="#5b4fb3" opacity="0.9"/>
  <rect x="285" y="160" width="30" height="80" fill="#5b4fb3" opacity="0.8"/>
  <circle cx="300" cy="240" r="15" fill="#ff6b9d"/>

  <!-- Stars -->
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="40">⭐</text>
  <text x="380" y="100" font-family="Arial, sans-serif" font-size="40">⭐</text>
  <text x="150" y="280" font-family="Arial, sans-serif" font-size="35">✨</text>
  <text x="420" y="280" font-family="Arial, sans-serif" font-size="35">✨</text>

  <text x="300" y="350" font-family="Arial, sans-serif" font-size="36" fill="white" text-anchor="middle" font-weight="bold">Успіх у навчанні!</text>
</svg>
