<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="booksGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#booksGrad)" rx="15"/>

  <!-- Stack of books -->
  <rect x="150" y="220" width="300" height="40" fill="#667eea" rx="5" opacity="0.8"/>
  <rect x="160" y="180" width="280" height="40" fill="#764ba2" rx="5" opacity="0.8"/>
  <rect x="170" y="140" width="260" height="40" fill="#3498db" rx="5" opacity="0.8"/>
  <rect x="180" y="100" width="240" height="40" fill="#ff6b9d" rx="5" opacity="0.8"/>

  <!-- Book details -->
  <rect x="155" y="225" width="15" height="30" fill="white" opacity="0.3"/>
  <rect x="165" y="185" width="15" height="30" fill="white" opacity="0.3"/>
  <rect x="175" y="145" width="15" height="30" fill="white" opacity="0.3"/>
  <rect x="185" y="105" width="15" height="30" fill="white" opacity="0.3"/>

  <text x="300" y="340" font-family="Arial, sans-serif" font-size="36" fill="#5b4fb3" text-anchor="middle" font-weight="bold">📚 Бібліотека 📖</text>
</svg>
