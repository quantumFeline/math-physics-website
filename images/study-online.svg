<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="studyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#studyGrad)" rx="15"/>

  <!-- Computer screen -->
  <rect x="150" y="100" width="300" height="200" fill="white" rx="10" opacity="0.9"/>
  <rect x="150" y="100" width="300" height="30" fill="rgba(91, 79, 179, 0.8)" rx="10 10 0 0"/>

  <!-- Icons on screen -->
  <text x="300" y="180" font-family="Arial, sans-serif" font-size="60" text-anchor="middle">📚</text>
  <text x="230" y="250" font-family="Arial, sans-serif" font-size="40" text-anchor="middle">💻</text>
  <text x="370" y="250" font-family="Arial, sans-serif" font-size="40" text-anchor="middle">✏️</text>

  <text x="300" y="360" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">Навчання онлайн</text>
</svg>
