<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradLyceum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#gradLyceum)" rx="15"/>

  <!-- Graduation cap icon -->
  <g transform="translate(200, 150)">
    <!-- Cap top -->
    <polygon points="0,-50 -70,-30 70,-30" fill="white" opacity="0.9"/>

    <!-- Cap board -->
    <rect x="-80" y="-30" width="160" height="15" fill="white" opacity="0.9" rx="3"/>

    <!-- Tassel -->
    <line x1="70" y1="-30" x2="85" y2="-50" stroke="white" stroke-width="3" opacity="0.9"/>
    <circle cx="85" cy="-50" r="8" fill="white" opacity="0.9"/>

    <!-- Book base -->
    <rect x="-50" y="0" width="100" height="50" fill="white" opacity="0.8" rx="4"/>
    <line x1="-50" y1="15" x2="50" y2="15" stroke="rgba(102, 126, 234, 0.4)" stroke-width="2"/>
    <line x1="-50" y1="30" x2="50" y2="30" stroke="rgba(102, 126, 234, 0.4)" stroke-width="2"/>
  </g>
</svg>
